<!doctype html>
<html lang="pt">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Registo de Visitantes e Membros</title>
  <script src="config.js"></script>
  <style>
    :root{--bg:#f4f7fb;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--primary:#2563eb;--primary2:#1d4ed8;--good:#16a34a;--bad:#dc2626}
    *{box-sizing:border-box} body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#eef5ff,#f8fafc);color:var(--ink)}
    .wrap{max-width:760px;margin:0 auto;padding:22px 14px 40px}.hero{background:linear-gradient(135deg,#0f172a,#1d4ed8);color:white;border-radius:24px;padding:26px 22px;box-shadow:0 20px 50px rgba(15,23,42,.18)}
    .hero h1{margin:0 0 8px;font-size:clamp(26px,6vw,40px);line-height:1.05}.hero p{margin:0;color:#dbeafe;font-size:16px}.card{margin-top:18px;background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(15,23,42,.08)}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{margin-bottom:14px}.field.full{grid-column:1/-1} label{display:block;font-weight:700;font-size:14px;margin:0 0 6px} .hint{font-size:12px;color:var(--muted);margin-top:4px}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;padding:12px 13px;font:inherit;background:#fff;color:var(--ink);outline:none} textarea{min-height:90px;resize:vertical} input:focus,select:focus,textarea:focus{border-color:#93c5fd;box-shadow:0 0 0 4px #dbeafe}
    .actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px}.btn{border:0;border-radius:999px;padding:13px 20px;font-weight:800;cursor:pointer;background:var(--primary);color:#fff;box-shadow:0 10px 22px rgba(37,99,235,.25)}.btn:hover{background:var(--primary2)}.btn.secondary{background:#e2e8f0;color:#0f172a;box-shadow:none}.btn:disabled{opacity:.55;cursor:not-allowed}
    .msg{display:none;margin-top:14px;padding:12px 14px;border-radius:16px;font-weight:700}.msg.ok{display:block;background:#dcfce7;color:#166534}.msg.bad{display:block;background:#fee2e2;color:#991b1b}.small{font-size:12px;color:var(--muted);margin-top:14px}.hidden{display:none!important}
    @media (max-width:640px){.grid{grid-template-columns:1fr}.wrap{padding:12px}.card{padding:15px;border-radius:18px}.hero{border-radius:20px;padding:22px 18px}.actions .btn{width:100%}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="hero">
      <h1>Registo de Visitantes e Membros</h1>
      <p>Preencha os dados abaixo. O registo será enviado directamente para a secretaria da igreja.</p>
    </section>

    <form id="visitorForm" class="card">
      <div class="grid">
        <div class="field full">
          <label for="registo_tipo">Tipo de registo *</label>
          <select id="registo_tipo" name="registo_tipo" required>
            <option value="visitante">Visitante</option>
            <option value="membro_efectivo">Membro efectivo</option>
          </select>
        </div>

        <div class="field visitante-only">
          <label for="data_visita">Data da visita / registo *</label>
          <input id="data_visita" name="data_visita" type="date" />
        </div>

        <div class="field visitante-only">
          <label for="tipo_culto_v">Tipo de culto *</label>
          <select id="tipo_culto_v" name="tipo_culto_v">
            <option value="">Seleccione</option>
            <option value="culto_dominical_1">1.º Culto Dominical</option>
            <option value="culto_dominical_2">2.º Culto Dominical</option>
            <option value="culto_meio_semana">Culto de meio da semana</option>
            <option value="culto_especial">Culto especial</option>
          </select>
        </div>

        <div class="field visitante-only hidden" id="especCultoBox">
          <label for="espec_culto_v">Especifique o culto especial *</label>
          <input id="espec_culto_v" name="espec_culto_v" type="text" />
        </div>

        <div class="field visitante-only hidden" id="diaSemanaBox">
          <label for="dia_semana_v">Seleccione o dia *</label>
          <select id="dia_semana_v" name="dia_semana_v">
            <option value="">Seleccione</option>
            <option value="segunda">Segunda-feira</option><option value="terca">Terça-feira</option><option value="quarta">Quarta-feira</option><option value="quinta">Quinta-feira</option><option value="sexta">Sexta-feira</option><option value="sabado">Sábado</option>
          </select>
        </div>

        <div class="field full">
          <label for="nome_visitante">Nome e apelido *</label>
          <input id="nome_visitante" name="nome_visitante" type="text" required />
        </div>

        <div class="field">
          <label for="sexo_visitante">Sexo</label>
          <select id="sexo_visitante" name="sexo_visitante"><option value="">Opcional</option><option value="masculino">Masculino</option><option value="feminino">Feminino</option></select>
        </div>

        <div class="field">
          <label for="faixa_etaria">Faixa etária</label>
          <select id="faixa_etaria" name="faixa_etaria"><option value="">Opcional</option><option value="crianca">Criança</option><option value="adolescente">Adolescente</option><option value="jovem">Jovem</option><option value="adulto">Adulto</option><option value="idoso">Idoso</option></select>
        </div>

        <div class="field">
          <label for="telefone_whatsapp">Telefone/WhatsApp</label>
          <input id="telefone_whatsapp" name="telefone_whatsapp" type="tel" placeholder="Ex.: 84xxxxxxx" />
        </div>

        <div class="field">
          <label for="bairro_localidade">Bairro / Localidade</label>
          <input id="bairro_localidade" name="bairro_localidade" type="text" />
        </div>

        <div class="field visitante-only">
          <label for="primeira_vez">É a primeira vez que nos visita?</label>
          <select id="primeira_vez" name="primeira_vez"><option value="">Seleccione</option><option value="sim">Sim</option><option value="nao">Não</option></select>
        </div>

        <div class="field visitante-only">
          <label for="como_conheceu">Como nos conheceu?</label>
          <select id="como_conheceu" name="como_conheceu"><option value="">Opcional</option><option value="convite">Convite de alguém</option><option value="familia">Família</option><option value="redes_sociais">Redes sociais</option><option value="passando">Passando pela igreja</option><option value="outro">Outro</option></select>
        </div>

        <div class="field visitante-only">
          <label for="quer_contacto">Quer que entremos em contacto consigo? *</label>
          <select id="quer_contacto" name="quer_contacto"><option value="">Seleccione</option><option value="sim">Sim</option><option value="nao">Não</option></select>
        </div>

        <div class="field visitante-only hidden" id="telefoneContactoBox">
          <label for="telefone_para_contacto">Telefone para contacto *</label>
          <input id="telefone_para_contacto" name="telefone_para_contacto" type="tel" placeholder="Ex.: 84xxxxxxx" />
        </div>

        <div class="field full membro-only hidden">
          <label for="observacoes_membro">Observações do membro</label>
          <textarea id="observacoes_membro" name="observacoes_membro" placeholder="Dados adicionais, ministério, grupo, ou informação relevante."></textarea>
        </div>
      </div>

      <div id="msg" class="msg"></div>
      <div class="actions">
        <button class="btn" id="submitBtn" type="submit">Enviar registo</button>
        <button class="btn secondary" type="reset">Limpar</button>
      </div>
      <div class="small">Este formulário é público e não exige palavra-passe.</div>
    </form>
  </main>

<script>
const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2));

function labelMap(name, value){
  const maps = {
    registo_tipo: { visitante:'Visitante', membro_efectivo:'Membro efectivo' },
    tipo_culto_v: { culto_dominical_1:'1.º Culto Dominical', culto_dominical_2:'2.º Culto Dominical', culto_meio_semana:'Culto de meio da semana', culto_especial:'Culto especial' },
    sexo_visitante: { masculino:'Masculino', feminino:'Feminino' },
    faixa_etaria: { crianca:'Criança', adolescente:'Adolescente', jovem:'Jovem', adulto:'Adulto', idoso:'Idoso' },
    primeira_vez: { sim:'Sim', nao:'Não' },
    quer_contacto: { sim:'Sim', nao:'Não' },
    como_conheceu: { convite:'Convite de alguém', familia:'Família', redes_sociais:'Redes sociais', passando:'Passando pela igreja', outro:'Outro' }
  };
  return (maps[name] && maps[name][value]) || value || '';
}
function showMsg(type, text){ const m=$('#msg'); m.className='msg '+type; m.textContent=text; }
function hideMsg(){ const m=$('#msg'); m.className='msg'; m.textContent=''; }
function validMozPhone(v){ if(!v) return true; return /^(258)?8[2-7][0-9]{7}$/.test(String(v).replace(/[+\s]/g,'')); }
function syncVisibility(){
  const tipo = $('#registo_tipo').value;
  const isVisitante = tipo === 'visitante';
  $$('.visitante-only').forEach(el => el.classList.toggle('hidden', !isVisitante));
  $$('.membro-only').forEach(el => el.classList.toggle('hidden', isVisitante));
  $('#especCultoBox').classList.toggle('hidden', !(isVisitante && $('#tipo_culto_v').value === 'culto_especial'));
  $('#diaSemanaBox').classList.toggle('hidden', !(isVisitante && $('#tipo_culto_v').value === 'culto_meio_semana'));
  $('#telefoneContactoBox').classList.toggle('hidden', !(isVisitante && $('#quer_contacto').value === 'sim'));
}

$('#data_visita').valueAsDate = new Date();
['registo_tipo','tipo_culto_v','quer_contacto'].forEach(id => $('#'+id).addEventListener('change', syncVisibility));
syncVisibility();

$('#visitorForm').addEventListener('submit', async (e) => {
  e.preventDefault(); hideMsg();
  const url = window.APP_CONFIG && window.APP_CONFIG.APPS_SCRIPT_URL;
  if(!url) return showMsg('bad', 'Backend não configurado. Verifique o ficheiro config.js.');
  const fd = new FormData(e.currentTarget);
  const data = Object.fromEntries(fd.entries());
  data.menu_preencher = 'visitantes';
  data.registo_tipo_label = labelMap('registo_tipo', data.registo_tipo);
  data.tipo_culto_v_label = labelMap('tipo_culto_v', data.tipo_culto_v);
  data.sexo_visitante_label = labelMap('sexo_visitante', data.sexo_visitante);
  data.faixa_etaria_label = labelMap('faixa_etaria', data.faixa_etaria);
  data.primeira_vez_label = labelMap('primeira_vez', data.primeira_vez);
  data.como_conheceu_label = labelMap('como_conheceu', data.como_conheceu);
  data.quer_contacto_label = labelMap('quer_contacto', data.quer_contacto);

  if(data.registo_tipo === 'visitante'){
    if(!data.data_visita) return showMsg('bad', 'Indique a data da visita.');
    if(!data.tipo_culto_v) return showMsg('bad', 'Seleccione o tipo de culto.');
    if(data.tipo_culto_v === 'culto_especial' && !data.espec_culto_v) return showMsg('bad', 'Especifique o culto especial.');
    if(data.tipo_culto_v === 'culto_meio_semana' && !data.dia_semana_v) return showMsg('bad', 'Seleccione o dia do culto de meio da semana.');
    if(!data.quer_contacto) return showMsg('bad', 'Indique se quer ser contactado.');
    if(data.quer_contacto === 'sim' && !data.telefone_para_contacto) return showMsg('bad', 'Indique o telefone para contacto.');
  }
  if(!data.nome_visitante) return showMsg('bad', 'Indique o nome e apelido.');
  if(!validMozPhone(data.telefone_whatsapp)) return showMsg('bad', 'Telefone/WhatsApp inválido. Use 84xxxxxxx ou 25884xxxxxxx.');
  if(!validMozPhone(data.telefone_para_contacto)) return showMsg('bad', 'Telefone para contacto inválido. Use 84xxxxxxx ou 25884xxxxxxx.');

  const btn = $('#submitBtn'); btn.disabled = true; btn.textContent = 'A enviar...';
  try{
    const payload = { action:'submit', uuid:uid(), module:'visitantes', submittedAt:new Date().toISOString(), data, repeats:{} };
    const res = await fetch(url, { method:'POST', body:JSON.stringify(payload), headers:{ 'Content-Type':'text/plain;charset=utf-8' } });
    const out = await res.json();
    if(!out.ok) throw new Error(out.message || 'Não foi possível enviar o registo.');
    e.currentTarget.reset(); $('#data_visita').valueAsDate = new Date(); syncVisibility();
    showMsg('ok', 'Registo enviado com sucesso. Obrigado!');
  }catch(err){ showMsg('bad', err.message || 'Erro ao enviar. Tente novamente.'); }
  finally{ btn.disabled=false; btn.textContent='Enviar registo'; }
});
</script>
</body>
</html>
